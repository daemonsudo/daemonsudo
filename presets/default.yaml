# gate.yaml — the sudoers file for your agents
# Rules glob on MCP tool names: most-specific match wins, then file order.
# Actions: auto (pass through, receipted) · approve (a human must say yes) · deny (never).

defaults: approve        # unknown tools knock — safe by default
timeout: 10m             # nobody answers → deny

rules:
  read_*: auto           # adjust to your server's tool names
  list_*: auto
  get_*: auto
  delete_*: approve
  send_*: approve

redact:                  # these never land raw in receipts or approval cards
  - "*.password"
  - "*.api_key"
  - "*.token"
  - "*.secret"

channels:
  # telegram:
  #   token_env: GATE_TELEGRAM_TOKEN   # env var NAME — the token never lives here
  #   allowed_users: [123456789]
  # discord:
  #   token_env: GATE_DISCORD_TOKEN
  #   allowed_users: ["123456789012345678"]   # snowflakes are STRINGS
  web:
    port: 4910

# grants:                # approve once, allow (server, tool) for a while:
#   max_ttl: 8h          # the card offers once / 15m / 1h / session; TTLs clamp here
                         # manage with: daemonsudo grants · revoke <id> · the /grants page

# mirror:                # stream signed head checkpoints off-box; the mirror witnesses
#   url: http://backup-host:4930           # your `daemonsudo mirror --listen` receiver
#   token_env: DAEMONSUDO_MIRROR_TOKEN     # then audit with: daemonsudo verify --against <url|file>

# telemetry: true        # opt-in weekly ping of {version, anon_id} — nothing else, ever
